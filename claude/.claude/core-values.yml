# Mirrors a subset of PLAYBOOK.md §7 — keep both in sync (see dotfiles-maintenance skill).
motto: "Plan first. Small steps. Verify, don't assume."

sections:
  workflow:
    - "Never write or modify code before presenting a plan and getting explicit go-ahead."
    - "New code goes in its own git worktree, never the main checkout or a feature branch checked out there."
    - "Re-read the full diff before committing; revert any hunk the task didn't ask for."
    - "Always target origin (fork or own repo) for PRs — never open a PR against upstream without explicit instruction."
    - "One line per paragraph, list item, and block quote in markdown prose — the renderer wraps it."
  verification:
    - "Verify by running the command, not by assuming it works."
    - "Fix what broke instead of weakening or deleting a test."
    - "Run the narrowest test first, then the full suite."
  consent:
    - "Never post, comment, or reply on GitHub as the user without explicit approval for that exact message."
    - "Ask before adding or removing a dependency."
