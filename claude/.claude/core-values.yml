---
# Mirrors a subset of PLAYBOOK.md §7 — keep both in sync (see dotfiles-maintenance skill).
motto: "Plan first. Small steps. Verify, don't assume."

sections:
  workflow:
    - "Never write or modify code before presenting a plan and getting explicit go-ahead."
    - "Personal repos in autonomous delivery (playbook §7a): a recorded critique replaces accepted on the plan."
    - "New code goes in its own git worktree, never the main checkout or a feature branch checked out there."
    - "Never type `git worktree add` yourself; use `worktree-create`."
    - "Re-read the full diff before committing; revert any hunk the task didn't ask for."
    - "Install gems with `bi`, never `bundle install`."
    - "Always target origin (fork or own repo) for PRs — never open a PR against upstream without explicit instruction."
    - "One line per paragraph, list item, and block quote in markdown prose — the renderer wraps it."
    - "Intent interviews read the repository first, split bundled requests, probe edge cases, read the draft back and record decisions."
    - "Bug fixes and chores stay at 1–3 questions; features and refactors probe fully."
  verification:
    - "Verify by running the command, not by assuming it works."
    - "Fix what broke instead of weakening or deleting a test."
    - "Every code change has tests. Configuration has no tests."
    - "A new feature has an integration test that proves it works and keeps working. It also has unit tests of its public methods and classes."
    - "Test public methods and classes only. Private methods never get tests of their own."
    - "Tests may follow the code. A bug fix is the exception: its regression test comes first and fails before the fix."
    - "Run the narrowest test first, then the full suite."
  consent:
    - "Never post, comment, or reply on GitHub as the user without explicit approval for that exact message."
    - "Ask before adding or removing a dependency."
    - "In autonomous delivery, agents never merge a pull request; Etienne's /finish is the merge approval."
