---
prSections:
  - title: Work reviews
    filters: is:open org:nedap review-requested:@me -reviewed-by:@me draft:false sort:updated-asc
  - title: Personal PRs
    filters: is:open user:eirvandelden draft:false
  - title: My work drafts
    filters: is:open org:nedap author:@me draft:true
  - title: "My work: needs reply"
    filters: is:open org:nedap author:@me draft:false comments:>0 -review:approved
  - title: "My work: changes requested"
    filters: is:open org:nedap author:@me draft:false review:changes_requested
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

issuesSections:
  - title: Assigned to me
    filters: is:open assignee:@me
  - title: My Issues
    filters: is:open author:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

pager:
  diff: delta --paging always --side-by-side

keybindings:
  universal:
    - key: ctrl+down
      builtin: pageDown
    - key: ctrl+up
      builtin: pageUp
  prs:
    - key: ctrl+m
      name: merge and delete branch
      command: ~/.config/gh-dash/scripts/merge-pr.sh {{.RepoName}} {{.PrNumber}}
    - key: M
      name: merge and delete branch
      command: ~/.config/gh-dash/scripts/merge-pr.sh {{.RepoName}} {{.PrNumber}}
    - key: C
      name: deep review (octo.nvim)
      command: >
        pane=$(herdr pane split --current --direction down --focus | jq -r
        '.result.pane.pane_id') && [ -n "$pane" ] && herdr pane run "$pane"
        "nvim -c 'silent Octo pr edit {{.PrNumber}} {{.RepoName}}'"
