---
pager:
  diff: delta

keybindings:
  prs:
    - key: C
      name: deep review (octo.nvim)
      command: >
        pane=$(herdr pane split --current --direction down --cwd
        "{{.RepoPath}}" --focus | jq -r '.result.pane.pane_id') && herdr
        pane run "$pane" nvim -c ":silent Octo pr edit {{.PrNumber}}
        {{.RepoName}}"
