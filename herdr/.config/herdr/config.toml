onboarding = false
[keys]
# On Dvorak, ";" sits on the physical Z key (bottom row, far left) — chording it with Ctrl
# stretched the same hand from home row to bottom row on every prefix press. ctrl+s keeps
# both pinkies near their resting spot on a split board: Ctrl on the left (Caps Lock), "s"
# (Dvorak, physical ;) on the right hand's home row. Default ctrl+b collides with vim's
# built-in Ctrl-b (page up).
prefix = "ctrl+s"
goto = "prefix+space"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

[ui.sound]
# herdr does not expand `~` — only a leading `/` counts as absolute, otherwise it resolves
# relative to this config file's own directory. Hardcode the real path instead.
# Only mp3 plays — anything else falls back to the default sound without failing loudly.
path         = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/ready-to-serve.mp3"
request_path = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/milord.mp3"
done_path    = "/Users/etienne.vandelden/Documents/Tones/Overlord/MinionVoiceData_ENGLISH/ForTheMaster02.mp3"

[theme]
# Take every color from the terminal's own palette. Ghostty already swaps solunized dark and
# light with the system appearance, so herdr follows along without a hand-copied palette, apart
# from the few tokens overridden below.
# auto_switch stays off because it swaps between two named themes, which this no longer needs.
name = "terminal"
auto_switch = false

# herdr has no border-width setting, so contrast is the only way to tell the focused pane apart:
# accent draws the focused border, overlay0 the inactive ones. active_row_bg is overridden because
# Palette::terminal hardcodes it to a fixed ANSI DarkGray that ignores the light palette entirely.
# Values are solunized light blue and bg_2. A [theme.custom] block does not follow the system
# light/dark switch, so dark mode gets these light-palette values too.
[theme.custom]
accent        = "#0068c9"
active_row_bg = "#d5d2c8"
overlay0      = "#d5d2c8"

[ui.toast]
delivery = "system"

[ui.sidebar.agents]
# The tab and agent tokens are drawn with overlay0, which the pane borders use too — so overlay0
# cannot be darkened for readability without making the inactive borders loud. Colouring these two
# tokens directly sidesteps that shared token. herdr styles them the same whether the row is
# active or not, so this applies to every agent row.
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#0068c9", dim = false }],
  [{ token = "agent", fg = "#0068c9", dim = false }],
]

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
