onboarding = false
[keys]
# On Dvorak, ";" sits on the physical Z key (bottom row, far left) — chording it with Ctrl
# stretched the same hand from home row to bottom row on every prefix press. ctrl+s keeps
# both pinkies near their resting spot on a split board: Ctrl on the left (Caps Lock), "s"
# (Dvorak, physical ;) on the right hand's home row. Default ctrl+b collides with vim's
# built-in Ctrl-b (page up).
prefix = "ctrl+s"
goto = "prefix+space"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

[ui.sound]
# herdr does not expand `~` — only a leading `/` counts as absolute, otherwise it resolves
# relative to this config file's own directory. Hardcode the real path instead.
path         = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/ready-to-serve.mp3"
request_path = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/milord.mp3"
done_path    = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/jobs-done.mp3"

[theme]
# Take every color from the terminal's own palette. Ghostty already swaps solunized dark and
# light with the system appearance, so herdr follows along without a hand-copied palette here.
# auto_switch stays off because it swaps between two named themes, which this no longer needs.
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
