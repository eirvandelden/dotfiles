onboarding = false
[keys]
# On Dvorak, ";" sits on the physical Z key (bottom row, far left) — chording it with Ctrl
# stretched the same hand from home row to bottom row on every prefix press. ctrl+s keeps
# both pinkies near their resting spot on a split board: Ctrl on the left (Caps Lock), "s"
# (Dvorak, physical ;) on the right hand's home row. Default ctrl+b collides with vim's
# built-in Ctrl-b (page up).
prefix = "ctrl+s"
goto = "prefix+space"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

# Herdr allows one custom theme, and these are solunized's dark colors. Pinning panel_bg to
# solunized's own dark background keeps the panel readable by day too — with "reset" the panel
# followed the terminal into light mode while the text stayed pale, down to 1.3:1 on the rows.
[theme.custom]
panel_bg = "#012b38"
accent = "#ea8347"
surface0 = "#0d3b4a"
surface1 = "#2a5d6e"
surface_dim = "#5e8c96"
overlay0 = "#2a5d6e"
overlay1 = "#5e8c96"
text = "#cce2e7"
subtext0 = "#b0d0d5"
mauve = "#ac85e8"
green = "#73b936"
yellow = "#d9b02a"
red = "#c51f23"
blue = "#4191f4"
teal = "#3fc4b6"
peach = "#ea8347"

[ui.sound]
# herdr does not expand `~` — only a leading `/` counts as absolute, otherwise it resolves
# relative to this config file's own directory. Hardcode the real path instead.
path         = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/ready-to-serve.mp3"
request_path = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/milord.mp3"
done_path    = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/jobs-done.mp3"

[theme]
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
