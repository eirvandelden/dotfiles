onboarding = false
[keys]
# ctrl+; echoes the neovim leader (;) without stealing plain `;` keystrokes the way a bare
# `;` prefix would — herdr's prefix is a raw keystroke grab across every pane, unlike vim's
# leader which only fires inside vim's own normal-mode keymap engine. Default ctrl+b collides
# with vim's built-in Ctrl-b (page up).
prefix = "ctrl+;"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

# Herdr allows one custom theme, and these are solunized's dark colors. Pinning panel_bg to
# solunized's own dark background keeps the panel readable by day too — with "reset" the panel
# followed the terminal into light mode while the text stayed pale, down to 1.3:1 on the rows.
[theme.custom]
panel_bg = "#012b38"
accent = "#ea8347"
surface0 = "#0d3b4a"
surface1 = "#2a5d6e"
surface_dim = "#5e8c96"
overlay0 = "#2a5d6e"
overlay1 = "#5e8c96"
text = "#cce2e7"
subtext0 = "#b0d0d5"
mauve = "#ac85e8"
green = "#73b936"
yellow = "#d9b02a"
# Deliberately solunized's brighter red, not the darker one the ghostty palette now uses. Herdr
# draws red as text on the dark panel ("blocked"), where the darker red falls to 2.9:1; ghostty's
# red gets painted behind text instead, so there it needs to be dark.
red = "#f7564f"
blue = "#4191f4"
teal = "#3fc4b6"
peach = "#ea8347"

[ui.sound]
# herdr does not expand `~` — only a leading `/` counts as absolute, otherwise it resolves
# relative to this config file's own directory. Hardcode the real path instead.
path         = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/ready-to-serve.mp3"
request_path = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/milord.mp3"
done_path    = "/Users/etienne.vandelden/Documents/Tones/Warcraft/Humans/jobs-done.mp3"

[theme]
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
