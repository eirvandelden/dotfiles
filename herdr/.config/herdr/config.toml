onboarding = false
[keys]
# On Dvorak, ";" sits on the physical Z key (bottom row, far left) — chording it with Ctrl
# stretched the same hand from home row to bottom row on every prefix press. ctrl+s keeps
# both pinkies near their resting spot on a split board: Ctrl on the left (Caps Lock), "s"
# (Dvorak, physical ;) on the right hand's home row. Default ctrl+b collides with vim's
# built-in Ctrl-b (page up).
prefix = "ctrl+s"
goto = "prefix+space"
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

# Default pane-focus bindings are hjkl, which sit together only on QWERTY. On Dvorak they're
# scattered across the keyboard, so arrow keys replace them.
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# Opens the file viewer beside the focused pane. worktree-viewer roots it at the worktree the
# pane's agent created or reused with worktree-create; without one it opens at the pane's
# folder, with the worktree picker in the main checkout. Panes without an agent, and a viewer
# already open in the tab, go to the plugin's own action.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = '"$HOME/.config/git/worktree-tools/worktree-viewer" split'

# The same viewer in its own tab instead of a split, for when reading a file is the task rather
# than a glance beside the work: prose gets the whole terminal instead of a column the tree takes
# a share of. Idempotent — it switches to an existing viewer tab rather than opening a second, and
# toggles off when already there. Shift+f is free: herdr's defaults take shift with r, n, g, w, d,
# t, x, p and Tab, and this file takes prefix+shift+1..9 for workspaces. Like prefix+f it runs
# worktree-viewer, with the same rules; the hand-over goes to the plugin's own tab action.
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = '"$HOME/.config/git/worktree-tools/worktree-viewer" tab'

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

[ui.sound]
# herdr does not expand `~` — only a leading `/` counts as absolute, otherwise it resolves
# relative to this config file's own directory. Hardcode the real path instead.
# Only mp3 plays — anything else falls back to the default sound without failing loudly.
# herdr has no volume setting, so these are quieter copies (0.3 of the original level) that
# `herdr/.config/herdr/scripts/quieter-tones.sh <original.mp3>` writes to ~/Documents/Tones/herdr/.
path         = "/Users/etienne.vandelden/Documents/Tones/herdr/ready-to-serve.mp3"
request_path = "/Users/etienne.vandelden/Documents/Tones/herdr/milord.mp3"
done_path    = "/Users/etienne.vandelden/Documents/Tones/herdr/jobs-done.mp3"
# done_path    = "/Users/etienne.vandelden/Documents/Tones/herdr/ForTheMaster02.mp3"

[theme]
# Take the base palette from the terminal. Ghostty already swaps solunized dark and light with the
# system appearance, and herdr follows its light/dark report. auto_switch is on only so the two
# mode tables below apply: both names stay "terminal", and each table overrides six tokens.
name = "terminal"
auto_switch = true
light_name = "terminal"
dark_name = "terminal"

# The tab bar and sidebar share one frame colour, bg_1, and the panes keep the terminal background
# (bg_0), so the panes read as cards on the frame. panel_bg paints the tab bar, popups and the mode
# bar, sidebar_bg the sidebar, and surface_dim the seams, so all three take the frame colour.
# active_row_bg is the pane colour, so a selected sidebar row joins the panes. accent draws the
# focused pane border and overlay0 the inactive ones.
# In dark mode no colour is darker than the panes, so the frame is the lighter bg_1.
# herdr 0.9.5 has no setting for rounded corners, pane padding, gap size, a paintable gap between
# split panes, or the colour of a split divider. Values come from the solunized herdr template
# (~/Developer/solunized/applications/herdr), run through generate_themes.rb.
[theme.custom.light]
accent        = "#a44910"
active_row_bg = "#fffbf1"
overlay0      = "#d5d2c8"
panel_bg      = "#eeeae0"
sidebar_bg    = "#eeeae0"
surface_dim   = "#eeeae0"

[theme.custom.dark]
accent        = "#fa9253"
active_row_bg = "#012b38"
overlay0      = "#2a5d6e"
panel_bg      = "#0d3b4a"
sidebar_bg    = "#0d3b4a"
surface_dim   = "#0d3b4a"

[ui.toast]
delivery = "system"

[ui.sidebar.agents]
# Two lines per agent: the state icon with the terminal title, then the workspace. The icon already
# shows the state, so there is no state text line. herdr draws the title with overlay0, which is
# nearly invisible on the frame (contrast 1.3 light, 1.7 dark), and a fixed fg cannot follow the
# light/dark switch. dim_0 #6a8990 reads at about 3.1 in both modes, so the title takes it.
rows = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#6a8990", dim = false }],
  ["workspace"],
]

[ui]
pane_gaps = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
