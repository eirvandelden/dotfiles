---
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-capybara
  - rubocop-minitest
  - rubocop-obsession
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rails
  - rubocop-rbs_inline
  - rubocop-rspec

AllCops:
  # RuboCop has a bunch of cops enabled by default. This setting tells RuboCop
  # to ignore them, so only the ones explicitly set in this file are enabled.
  DisabledByDefault: true
  SuggestExtensions: true

  Exclude:
    - '**/app/assets/**/*'
    - '**/db/**/*schema.rb'
    - '**/db/schema.rb'
    - '**/log/**/*'
    - '**/node_modules/**/*'
    - '**/public/**/*'
    - '**/storage/**/*'
    - '**/templates/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'
    - 'actionmailbox/test/dummy/**/*'
    - 'actionpack/lib/action_dispatch/journey/parser.rb'
    - 'actiontext/test/dummy/**/*'
    - 'bin/**/*'

  NewCops: enable ## Cops that need decisions are enabled by default
# Default Cops
Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb

Style/FrozenStringLiteralComment:
  EnforcedStyle: never

# Cops from Extensions
Minitest/UnreachableAssertion:
  Enabled: true

Performance/BindCall:
  Enabled: true
Performance/DeletePrefix:
  Enabled: true
Performance/DeleteSuffix:
  Enabled: true
Performance/EndWith:
  Enabled: true
Performance/FlatMap:
  Enabled: true
Performance/MapCompact:
  Enabled: true
Performance/RedundantMerge:
  Enabled: true
Performance/RegexpMatch:
  Enabled: true
Performance/ReverseEach:
  Enabled: true
Performance/SelectMap:
  Enabled: true
Performance/StartWith:
  Enabled: true
Performance/StringReplacement:
  Enabled: true
Performance/UnfreezeString:
  Enabled: true

# rubocop-rails-omakase turns these on for test/**/*, and they rewrite plain Minitest
# refute / assert ! into ActiveSupport-only assert_not / assert_no_match. Rails projects
# get them from rubocop-eirvandelden's config/rails.yml.
Rails/AssertNot:
  Enabled: false
Rails/RefuteMethods:
  Enabled: false
Rails/IndexBy:
  Enabled: true
Rails/IndexWith:
  Enabled: true

# Cops from rbs_inline
# RBS 4 inline syntax and Steep's `inline: true` need no magic comment, so check every file.
# `# rbs_inline: disabled` is the only way out; a leftover `# rbs_inline: enabled` is flagged.
# Public methods, attr_* and Data/Struct attributes must carry a `#:` type. This mirrors
# rubocop-eirvandelden's config/default.yml and config/rails.yml; change both together.
Style/RbsInline:
  Mode: opt_out
# rubocop-rails-omakase enables this cop, which reads `#:` as a comment missing its space.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
Style/RbsInline/DataClassCommentAlignment:
  Enabled: true
Style/RbsInline/DataDefineWithBlock:
  Enabled: true
Style/RbsInline/EmbeddedRbsSpacing:
  Enabled: true
Style/RbsInline/InvalidComment:
  Enabled: true
Style/RbsInline/InvalidTypes:
  Enabled: true
Style/RbsInline/KeywordSeparator:
  Enabled: true
Style/RbsInline/MethodCommentSpacing:
  Enabled: true
Style/RbsInline/MissingDataClassAnnotation:
  Enabled: true
Style/RbsInline/MissingStructClassAnnotation:
  Enabled: true
# Migrations are generated, run once and never called from code.
Style/RbsInline/MissingTypeAnnotation:
  Enabled: true
  EnforcedStyle: method_type_signature
  Visibility: public
  Exclude:
    - '**/db/migrate/**/*'
Style/RbsInline/ParametersSeparator:
  Enabled: true
Style/RbsInline/RedundantAnnotationWithSkip:
  Enabled: true
Style/RbsInline/RedundantInstanceVariableAnnotation:
  Enabled: true
# The default doc_style would make autocorrect delete a `#:` signature beside `# @rbs` lines.
Style/RbsInline/RedundantTypeAnnotation:
  Enabled: true
  EnforcedStyle: method_type_signature
Style/RbsInline/RequireRbsInlineComment:
  Enabled: true
Style/RbsInline/StructClassCommentAlignment:
  Enabled: true
Style/RbsInline/StructNewWithBlock:
  Enabled: true
Style/RbsInline/UnmatchedAnnotations:
  Enabled: true
Style/RbsInline/VariableCommentSpacing:
  Enabled: true
