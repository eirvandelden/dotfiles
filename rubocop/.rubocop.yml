---
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-capybara
  - rubocop-minitest
  - rubocop-obsession
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rails
  - rubocop-rbs_inline
  - rubocop-rspec

AllCops:
  # RuboCop has a bunch of cops enabled by default. This setting tells RuboCop
  # to ignore them, so only the ones explicitly set in this file are enabled.
  DisabledByDefault: true
  SuggestExtensions: true

  Exclude:
    - '**/app/assets/**/*'
    - '**/db/**/*schema.rb'
    - '**/db/schema.rb'
    - '**/log/**/*'
    - '**/node_modules/**/*'
    - '**/public/**/*'
    - '**/storage/**/*'
    - '**/templates/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'
    - 'actionmailbox/test/dummy/**/*'
    - 'actionpack/lib/action_dispatch/journey/parser.rb'
    - 'actiontext/test/dummy/**/*'
    - 'bin/**/*'

  NewCops: enable ## Cops that need decisions are enabled by default
# Default Cops
Metrics/BlockLength:
  Exclude:
    - spec/**/*_spec.rb

Style/FrozenStringLiteralComment:
  EnforcedStyle: never

# Cops from Extensions
Minitest/UnreachableAssertion:
  Enabled: true

Performance/BindCall:
  Enabled: true
Performance/DeletePrefix:
  Enabled: true
Performance/DeleteSuffix:
  Enabled: true
Performance/EndWith:
  Enabled: true
Performance/FlatMap:
  Enabled: true
Performance/MapCompact:
  Enabled: true
Performance/RedundantMerge:
  Enabled: true
Performance/RegexpMatch:
  Enabled: true
Performance/ReverseEach:
  Enabled: true
Performance/SelectMap:
  Enabled: true
Performance/StartWith:
  Enabled: true
Performance/StringReplacement:
  Enabled: true
Performance/UnfreezeString:
  Enabled: true

# rubocop-rails-omakase turns these on for test/**/*, and they rewrite plain Minitest
# refute / assert ! into ActiveSupport-only assert_not / assert_no_match. Rails projects
# get them from rubocop-eirvandelden's config/rails.yml.
Rails/AssertNot:
  Enabled: false
Rails/RefuteMethods:
  Enabled: false
Rails/IndexBy:
  Enabled: true
Rails/IndexWith:
  Enabled: true

# Cops from rbs_inline
# RBS 4 inline syntax and Steep's `inline: true` need no magic comment, so check every file.
# Only cops that validate an existing annotation are on. The fallback lints repositories that
# have no annotations yet, so the cops that demand annotations stay off.
Style/RbsInline:
  Mode: opt_out
Style/RbsInline/InvalidComment:
  Enabled: true
Style/RbsInline/InvalidTypes:
  Enabled: true
Style/RbsInline/KeywordSeparator:
  Enabled: true
Style/RbsInline/ParametersSeparator:
  Enabled: true
Style/RbsInline/UnmatchedAnnotations:
  Enabled: true
Style/RbsInline/RedundantTypeAnnotation:
  Enabled: true
Style/RbsInline/MethodCommentSpacing:
  Enabled: true
Style/RbsInline/VariableCommentSpacing:
  Enabled: true
Style/RbsInline/EmbeddedRbsSpacing:
  Enabled: true
Style/RbsInline/RedundantAnnotationWithSkip:
  Enabled: true
