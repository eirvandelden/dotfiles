---
name: Dotfiles tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install minitest --no-document
      # editor_test.rb, rv_ci_fallback_test.rb and secrets_loader_test.rb source zsh scripts.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install lefthook
        env:
          # Pinned to the version installed locally via rv (`lefthook --version`).
          # Bump this alongside the rv gem, and update the checksum below from the
          # release's lefthook_checksums.txt.
          LEFTHOOK_VERSION: "2.1.12"
          LEFTHOOK_SHA256: "22ff1ad48d1a0f4dca8d6b7e920056c6a9015f9204e5b693858ed9c2db759a16"
        run: |
          set -o pipefail
          asset="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          curl -fsSLO "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/${asset}"
          echo "${LEFTHOOK_SHA256}  ${asset}" | sha256sum -c -
          install -m 755 "${asset}" /usr/local/bin/lefthook
          rm "${asset}"
      - name: Install cspell
        # Pinned to the version installed locally (`cspell --version`), so
        # lefthook_local_hooks_test.rb exercises the real spelling fallback
        # instead of skipping because cspell is missing from PATH.
        run: npm install -g cspell@10.0.0
      - name: Run test/*_test.rb
        run: |
          set -o pipefail
          for file in test/*_test.rb; do
            echo "=== $file ==="
            ruby -Itest "$file"
          done
