---
name: Dotfiles tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install minitest --no-document
      # editor_test.rb, rv_ci_fallback_test.rb and secrets_loader_test.rb source zsh scripts.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install lefthook
        # Always the latest GitHub release, no version to remember to bump.
        # Checksum is still verified, from that same release's own
        # lefthook_checksums.txt.
        run: |
          set -o pipefail
          tag=$(curl -fsSL https://api.github.com/repos/evilmartians/lefthook/releases/latest | jq -r .tag_name)
          version=${tag#v}
          asset="lefthook_${version}_Linux_x86_64"
          curl -fsSLO "https://github.com/evilmartians/lefthook/releases/download/${tag}/${asset}"
          curl -fsSLO "https://github.com/evilmartians/lefthook/releases/download/${tag}/lefthook_checksums.txt"
          grep " ${asset}\$" lefthook_checksums.txt | sha256sum -c -
          install -m 755 "${asset}" /usr/local/bin/lefthook
          rm "${asset}" lefthook_checksums.txt
      - name: Install cspell
        # Always the latest npm release; npm's own registry integrity check
        # covers it, so no separate checksum step is needed here.
        run: npm install -g cspell
      - name: Run test/*_test.rb
        run: |
          set -o pipefail
          for file in test/*_test.rb; do
            echo "=== $file ==="
            ruby -Itest "$file"
          done
